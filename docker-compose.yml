---
services:
  web:
    image: 'gitlab/gitlab-ce:latest'
    restart: always
    container_name: 'gitlab'
    hostname: '$GITLAB_DOMAIN'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://$GITLAB_DOMAIN'
        gitlab_rails['gitlab_shell_ssh_port'] = 22
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = 'exim'
        gitlab_rails['smtp_port'] = 25
        gitlab_rails['smtp_domain'] = 'exim'
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = 'none'
        gitlab_rails['smtp_enable_starttls_auto'] = false
        gitlab_rails['smtp_ssl'] = false
        gitlab_rails['smtp_force_ssl'] = false
        nginx['ssl_certificate'] = "/etc/gitlab/ssl/$GITLAB_DOMAIN.crt"
        nginx['ssl_certificate_key'] = "/etc/gitlab/ssl/$GITLAB_DOMAIN.key"
        letsencrypt['enable'] = false
        registry_external_url 'https://$GITLAB_DOMAIN:5005'
        gitlab_rails['registry_enabled'] = true
        gitlab_rails['registry_host'] = "$GITLAB_DOMAIN"
        registry['enable'] = true
        registry['registry_http_addr'] = "127.0.0.1:5000"
        registry['log_directory'] = "/var/log/gitlab/registry"
        registry['env_directory'] = "/opt/gitlab/etc/registry/env"
        registry_nginx['enable'] = true
        registry_nginx['listen_port'] = 5005
        registry_nginx['ssl_certificate'] = "/etc/gitlab/ssl/$GITLAB_DOMAIN.crt"
        registry_nginx['ssl_certificate_key'] = "/etc/gitlab/ssl/$GITLAB_DOMAIN.key"
        prometheus_monitoring['enable'] = false
    ports:
      - '80:80'
      - '443:443'
      - '22:22'
      - '5005:5005'
    volumes:
      - '$GITLAB_HOME/config:/etc/gitlab'
      - '$GITLAB_HOME/logs:/var/log/gitlab'
      - '$GITLAB_HOME/data:/var/opt/gitlab'
    shm_size: '256m'
    networks:
      - gitlab
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    depends_on:
      - web
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '$GITLAB_HOME/gitlab-runner/config:/etc/gitlab-runner'
      - '$GITLAB_HOME/gitlab-runner/data:/home/gitlab_ci_multi_runner/data'
    environment:
      - CI_SERVER_URL=https://$GITLAB_DOMAIN/ci
    networks:
      - gitlab
  exim:
    image: tianon/exim4
    restart: always
    container_name: 'exim'
    hostname: '$GITLAB_DOMAIN'
    ports:
      - '25:25'
    networks:
      - gitlab
networks:
  gitlab:
    name: gitlab-network
